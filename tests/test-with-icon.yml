name: Test badge with icon
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          label: 'Build'
          status: 'passing'
          color: 'green'
          icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PC9zdmc+'
          icon-width: 13
      - name: Assert badge output is non-empty
        env:
          BADGE: ${{ steps.action.outputs.badge }}
        run: |
          echo "badge output length: ${#BADGE}"
          if [ -z "$BADGE" ]; then
            echo "FAIL: badge output is empty"
            exit 1
          fi
          echo "PASS: badge output is non-empty"
      - name: Assert badge output contains SVG
        env:
          BADGE: ${{ steps.action.outputs.badge }}
        run: |
          echo "badge: $BADGE"
          if ! echo "$BADGE" | grep -qi '<svg'; then
            echo "FAIL: badge output does not contain SVG element"
            exit 1
          fi
          echo "PASS: badge output contains SVG element"
      - name: Assert badge contains label text
        env:
          BADGE: ${{ steps.action.outputs.badge }}
        run: |
          if ! echo "$BADGE" | grep -q 'Build'; then
            echo "FAIL: badge output does not contain label 'Build'"
            exit 1
          fi
          echo "PASS: badge contains label text"
      - name: Assert badge contains status text
        env:
          BADGE: ${{ steps.action.outputs.badge }}
        run: |
          if ! echo "$BADGE" | grep -q 'passing'; then
            echo "FAIL: badge output does not contain status 'passing'"
            exit 1
          fi
          echo "PASS: badge contains status text"
