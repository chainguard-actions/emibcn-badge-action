name: Test badge with flat style
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: badge
        uses: .
        with:
          label: Tests
          status: failing
          color: red
          style: flat
          label-color: '444'
      - name: Assert flat style badge output is non-empty SVG
        env:
          BADGE: ${{ steps.badge.outputs.badge }}
        run: |
          echo "badge output length: ${#BADGE}"
          echo "badge (first 300 chars): ${BADGE:0:300}"
          if [ -z "$BADGE" ]; then
            echo "FAIL: badge output is empty"
            exit 1
          fi
          if ! echo "$BADGE" | grep -qi '<svg'; then
            echo "FAIL: badge output does not contain <svg"
            exit 1
          fi
          echo "PASS: flat style badge output contains SVG content"
