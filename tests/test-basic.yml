name: Test basic badge generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: badge
        uses: .
        with:
          label: Build
          status: passing
          color: green
      - name: Assert badge output is non-empty SVG
        env:
          BADGE: ${{ steps.badge.outputs.badge }}
        run: |
          echo "badge output length: ${#BADGE}"
          echo "badge (first 200 chars): ${BADGE:0:200}"
          if [ -z "$BADGE" ]; then
            echo "FAIL: badge output is empty"
            exit 1
          fi
          if ! echo "$BADGE" | grep -qi '<svg'; then
            echo "FAIL: badge output does not contain <svg"
            exit 1
          fi
          echo "PASS: badge output contains SVG content"
