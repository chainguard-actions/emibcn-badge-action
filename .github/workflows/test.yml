on:
  push:
    branches:
    - '*'
    - '!badges'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: A job to test this action
    steps:

    # Get current banch name to use it as dest directory
    - name: Extract branch name
      shell: bash
      id: extract_branch
      run: |
        safe_branch=$(printf '%s' "${GITHUB_REF#refs/heads/}" | tr -d '\n\r')
        echo "branch=${safe_branch}" >> "${GITHUB_OUTPUT}"

    - name: Prepare environment
      id: coverage
      run: |
        # Generates a GitHub Workflow output named `lines` with a coverage value
        echo "lines=${COVERAGE}" >> "${GITHUB_OUTPUT}"

        # Sanitize BADGE_PATH to prevent newline injection
        safe_path=$(printf '%s' "${BADGE_PATH}" | tr -d '\n\r')

        # Output values to be used by other steps
        echo "path=${safe_path}" >> "${GITHUB_OUTPUT}"
        echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
      env:
        COVERAGE: 53.5%
        BADGE_PATH: ${{ steps.extract_branch.outputs.branch }}/test-badge.svg
        BRANCH: badges

    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      with:
        ref: ${{ steps.coverage.outputs.branch }}

    # Create the directory where badges will be saved, if needed
    - name: Create destination directory
      env:
        BADGE_PATH: ${{ steps.coverage.outputs.path }}
      run: mkdir -p "${BADGE_PATH%/*}"

    # Use the output from the `coverage` step
    - name: Generate the badge SVG image
      uses: emibcn/badge-action@402bc57ea8b5882e5fda2c5ca751ecf8e0b49394 # v2.0.1
      id: badge
      with:
        label: 'Test coverage'
        status: ${{ steps.coverage.outputs.lines }}
        color: 'blue,555,daf'
        path: ${{ steps.coverage.outputs.path }}

    - name: Upload badge as artifact
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
      with:
        name: badge
        path: ${{ steps.coverage.outputs.path }}
        if-no-files-found: error

    - name: Commit badge
      continue-on-error: true
      env:
        BADGE: ${{ steps.coverage.outputs.path }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "${BADGE}"
        git commit -m "Add/Update badge"
    - name: Push badge commit
      uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
      if: ${{ success() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ steps.coverage.outputs.branch }}
